name: RADHA Private Verification Relay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RADHA_PRIVATE_REPOSITORY: ${{ secrets.RADHA_PRIVATE_REPOSITORY }}
      RADHA_PRIVATE_READ_TOKEN: ${{ secrets.RADHA_PRIVATE_READ_TOKEN }}
      LAS_PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
      LAS_PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout relay metadata
        uses: actions/checkout@v4
        with:
          path: relay
          persist-credentials: false
          fetch-depth: 1

      - name: RADHA repository secret present
        if: ${{ env.RADHA_PRIVATE_REPOSITORY != '' }}
        run: "true"

      - name: RADHA token secret present
        if: ${{ env.RADHA_PRIVATE_READ_TOKEN != '' }}
        run: "true"

      - name: Legacy repository secret present
        if: ${{ env.LAS_PRIVATE_REPOSITORY != '' }}
        run: "true"

      - name: Legacy token secret present
        if: ${{ env.LAS_PRIVATE_READ_TOKEN != '' }}
        run: "true"

      - name: Resolve private bridge inputs
        shell: bash
        run: |
          set -euo pipefail
          repo="${RADHA_PRIVATE_REPOSITORY:-${LAS_PRIVATE_REPOSITORY:-}}"
          token="${RADHA_PRIVATE_READ_TOKEN:-${LAS_PRIVATE_READ_TOKEN:-}}"
          if [ -z "$repo" ]; then
            echo "RADHA_BRIDGE_REPOSITORY=missing"
            exit 20
          fi
          if [ -z "$token" ]; then
            echo "RADHA_BRIDGE_TOKEN=missing"
            exit 21
          fi
          echo "RADHA_BRIDGE_REPOSITORY=present"
          echo "RADHA_BRIDGE_TOKEN=present"
          echo "private_repo=$repo" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$token"
          echo "private_token=$token" >> "$GITHUB_OUTPUT"
        id: bridge

      - name: Checkout exact private development head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.bridge.outputs.private_repo }}
          token: ${{ steps.bridge.outputs.private_token }}
          ref: work/birth-substrate
          path: private
          persist-credentials: false
          fetch-depth: 1

      - name: Record and bind privacy-safe revision proof
        shell: bash
        run: |
          set -euo pipefail
          cd private
          sha="$(git rev-parse HEAD)"
          proof="$(printf '%s' "$sha" | sha256sum | awk '{print $1}')"
          cd ..
          expected="$(sed -n 's/^private_sha256=//p' relay/verify-request.txt | tail -n 1)"
          if [ -z "$expected" ]; then
            echo "RADHA_REVISION_BINDING=missing"
            exit 30
          fi
          if [ "$proof" != "$expected" ]; then
            echo "RADHA_REVISION_BINDING=mismatch"
            exit 31
          fi
          echo "RADHA_REVISION_BINDING=match"
          echo "RADHA_PRIVATE_SHA256=$proof"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1 --path private
          rustc +1.98.1 --version
          cargo +1.98.1 --version

      - name: Format gate
        id: fmt
        continue-on-error: true
        shell: bash
        run: |
          cd private/invent_radha
          cargo +1.98.1 fmt --all -- --check >"$RUNNER_TEMP/radha-fmt.log" 2>&1

      - name: Compile gate
        id: check
        continue-on-error: true
        shell: bash
        run: |
          cd private/invent_radha
          cargo +1.98.1 check --workspace --all-targets >"$RUNNER_TEMP/radha-check.log" 2>&1

      - name: Test gate
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          cd private/invent_radha
          cargo +1.98.1 test --workspace --all-targets >"$RUNNER_TEMP/radha-test.log" 2>&1

      - name: Clippy gate
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          cd private/invent_radha
          cargo +1.98.1 clippy --workspace --all-targets -- -D warnings >"$RUNNER_TEMP/radha-clippy.log" 2>&1

      - name: Marker - format failed
        if: ${{ steps.fmt.outcome == 'failure' }}
        run: "true"

      - name: Marker - compile failed
        if: ${{ steps.check.outcome == 'failure' }}
        run: "true"

      - name: Marker - tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: "true"

      - name: Marker - clippy failed
        if: ${{ steps.clippy.outcome == 'failure' }}
        run: "true"

      - name: Final privacy-safe gate
        shell: bash
        run: |
          if [ "${{ steps.fmt.outcome }}" = "success" ] &&
             [ "${{ steps.check.outcome }}" = "success" ] &&
             [ "${{ steps.tests.outcome }}" = "success" ] &&
             [ "${{ steps.clippy.outcome }}" = "success" ]; then
            echo "RADHA_VERIFY_RESULT=PASS"
            exit 0
          fi
          echo "RADHA_VERIFY_RESULT=FAIL"
          exit 1
